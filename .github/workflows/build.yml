name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default: a read-only token is all any job needs except release, which re-grants
# contents: write to publish the GitHub Release. Fork PRs get a read-only token from GitHub regardless.
permissions:
  contents: read

# Fork-safety model (public repo). Every job runs on GitHub-hosted runners: ephemeral, secret-free
# except release, and free for public repos. Nothing here can reach the self-hosted FRAME-DESK runner,
# and this file must not target it. Signing secrets live ONLY in the release job (tag-triggered).
# Fork PRs also need maintainer approval (Settings → Actions → General).
jobs:
  # Quick checks on PRs — runs on GitHub-hosted (safe for public repo forks)
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fails the job if gradle-wrapper.jar is not an official Gradle release, before ./gradlew
      # runs it. A wrapper bump (Dependabot) replaces this binary; nothing else checks it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run lint and unit tests
        run: ./gradlew lint test

  # Full build on push to main and on v* tags.
  build:
    if: github.event_name == 'push' && github.repository == 'soult-io/embara-android'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fails the job if gradle-wrapper.jar is not an official Gradle release, before ./gradlew
      # runs it. A wrapper bump (Dependabot) replaces this binary; nothing else checks it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run lint, tests, and build APKs
        run: ./gradlew lint test assembleDebug assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: embara-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: embara-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: embara-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: warn

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Report build sizes
        if: always()
        run: |
          echo "## Build Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
            [ -f "$f" ] && echo "| $(basename $f) | $(du -h $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done

  # Instrumented tests via Gradle Managed Devices (aospAtd) — runs after build, does not block release.
  instrumented-tests:
    if: >-
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'soult-io/embara-android'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fails the job if gradle-wrapper.jar is not an official Gradle release, before ./gradlew
      # runs it. A wrapper bump (Dependabot) replaces this binary; nothing else checks it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # GitHub-hosted Linux runners support hardware-accelerated emulators once /dev/kvm is opened to
      # the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (Gradle Managed Device)
        run: ./gradlew :app:aospAtdDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/
          retention-days: 30
          if-no-files-found: ignore

  # Sign + publish on a v* tag — runs on GitHub-hosted (holds the signing secrets, no self-hosted needed).
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'soult-io/embara-android'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download unsigned release APK
        uses: actions/download-artifact@v4
        with:
          name: embara-release-unsigned
          path: unsigned/

      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: embara-release-aab
          path: aab/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > embara-release.jks

      - name: Sign APK with apksigner
        run: |
          mkdir -p signed
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          $APKSIGNER sign \
            --ks embara-release.jks \
            --ks-pass env:EMBARA_KEYSTORE_PASSWORD \
            --ks-key-alias "$EMBARA_KEY_ALIAS" \
            --key-pass env:EMBARA_KEY_PASSWORD \
            --out signed/embara-release.apk \
            unsigned/app-release-unsigned.apk
        env:
          EMBARA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EMBARA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EMBARA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Sign AAB with jarsigner
        run: |
          mkdir -p signed-aab
          cp aab/app-release.aab signed-aab/embara-release.aab
          jarsigner -keystore embara-release.jks \
            -storepass "$EMBARA_KEYSTORE_PASSWORD" \
            -keypass "$EMBARA_KEY_PASSWORD" \
            signed-aab/embara-release.aab \
            "$EMBARA_KEY_ALIAS"
        env:
          EMBARA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EMBARA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EMBARA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate SHA-256 checksums
        run: |
          cd signed && sha256sum embara-release.apk > embara-release.apk.sha256
          cd ../signed-aab && sha256sum embara-release.aab > embara-release.aab.sha256

      - name: Create GitHub Release
        # Third-party action on the job that holds the signing secrets — pin to a commit SHA so a
        # compromised/retagged upstream can't inject code near the keystore. Update deliberately.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            signed/embara-release.apk
            signed/embara-release.apk.sha256
            signed-aab/embara-release.aab
            signed-aab/embara-release.aab.sha256
          generate_release_notes: true

      - name: Cleanup keystore
        if: always()
        run: rm -f embara-release.jks
